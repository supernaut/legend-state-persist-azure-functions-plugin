name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release mid-flight. `changeset publish` pushes git tags and
  # publishes to npm in sequence, so an interrupted run can leave a tag with no
  # package behind it, which cannot be re-published under the same version.
  cancel-in-progress: false

env:
  COREPACK_INTEGRITY_KEYS: 0

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Git operations and the release pull request use RELEASE_TOKEN, not the
      # workflow token. `contents: write` remains because `changeset publish`
      # creates GitHub releases, and `id-token: write` is what npm OIDC and
      # provenance need. `pull-requests: write` is not listed: GITHUB_TOKEN no
      # longer opens the pull request.
      contents: write
      id-token: write
    # prevents this action from running on forks
    if: github.repository == 'supernaut/legend-state-persist-azure-functions-plugin'
    steps:
      # Fails loudly and early. The likeliest cause is an expired token, and
      # without this the run dies at checkout with an opaque 403.
      - name: Check the release token is present
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set on the 'release' environment, or it has expired and been removed. See RELEASING.md."
            exit 1
          fi

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          # Changesets reads tags and history to work out what to release and to
          # build the changelog. A shallow clone makes it guess.
          fetch-depth: 0
          # Persist RELEASE_TOKEN for the pushes changesets makes, so the branch
          # update and the tag are attributed to it rather than to GITHUB_TOKEN.
          # Anything GITHUB_TOKEN pushes cannot trigger a workflow.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Enable pnpm with corepack
        run: corepack enable && corepack prepare pnpm@$(cat package.json | jq -r .volta.pnpm) --activate
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: './package.json'
          cache: pnpm
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full gate rather than just `pnpm build`: this job can publish, and the
      # CI workflow is a separate run that this one does not wait for.
      - name: Verify and build
        run: pnpm run ci

      - name: Setup npm registry (OIDC will auto-authenticate)
        run: |
          # Create minimal .npmrc without auth token
          # npm CLI (11.5.1+) will auto-detect OIDC via id-token permission
          cat > ~/.npmrc << 'EOF'
          registry=https://registry.npmjs.org/
          EOF

      # RELEASE_TOKEN rather than GITHUB_TOKEN. A pull request opened by
      # GITHUB_TOKEN does not trigger other workflows, so the release pull
      # request would never get a CI run.
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: release'
          # Fallback only. The next step renames it once the bumped version is
          # known. The default is "Version Packages", which is not a valid
          # conventional commit, and this title becomes the commit message when
          # the pull request is squashed.
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # The version cannot be known before `changeset version` has run, so the
      # title is set afterwards by reading it back off the pushed branch.
      - name: Put the version in the release pull request title
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          git fetch origin changeset-release/main
          version=$(git show origin/changeset-release/main:package.json | jq -r .version)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::warning::Could not read the bumped version; leaving the title alone."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --title "chore: release v${version}"

      - name: Publish to npm with OIDC
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
